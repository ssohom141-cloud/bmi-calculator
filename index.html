<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BMI Calculator - By Sohom</title>
<style>
  body{
    display:flex;justify-content:center;align-items:center;min-height:100vh;
    background:linear-gradient(135deg,#667eea,#764ba2);
    font-family:'Poppins', sans-serif; margin:0;
  }
  .box{
    background:#fff;padding:35px;border-radius:20px;
    box-shadow:0 15px 40px rgba(0,0,0,0.3);
    width:90%;max-width:400px;text-align:center
  }
  h2{color:#333;margin-bottom:20px}
  label{display:block;text-align:left;margin:10px 0 5px;font-weight:600;color:#555}
  input{
    width:100%;padding:12px;margin-bottom:15px;border:2px solid #ddd;
    border-radius:10px;font-size:16px;box-sizing:border-box;
  }
  input:focus{border-color:#007BFF;outline:none}
  button{
    background:#007BFF;color:#fff;border:none;padding:14px 20px;
    border-radius:10px;cursor:pointer;font-weight:bold;font-size:16px;
    width:100%;transition:0.3s;
  }
  button:hover{background:#0056b3;transform:scale(1.03)}
  #result{
    margin-top:20px;padding:15px;border-radius:10px;
    font-size:20px;font-weight:bold;display:none;
  }
</style>
</head>
<body>
<div class="box">
  <h2>⚖️ BMI Calculator</h2>
  
  <label>Height (CM)</label>
  <input type="number" id="height" placeholder="Example: 170">
  
  <label>Weight (KG)</label>
  <input type="number" id="weight" placeholder="Example: 65">
  
  <button onclick="calcBMI()">Calculate BMI</button>
  
  <div id="result"></div>
</div>

<script>
function calcBMI(){
  let h = document.getElementById("height").value;
  let w = document.getElementById("weight").value;
  let resultDiv = document.getElementById("result");
  
  if(h == "" || w == "" || h <= 0 || w <= 0){
    alert("Please enter valid Height and Weight bos!");
    return;
  }
  
  h = h/100; // CM ke meter e convert
  let bmi = (w/(h*h)).toFixed(2);
  
  let category = "";
  let color = "";
  
  if(bmi < 18.5){
    category = "Underweight 😔";
    color = "#ff9800"; // Orange
  }
  else if(bmi >= 18.5 && bmi <= 24.9){
    category = "Normal Weight 🔥";
    color = "#4CAF50"; // Green
  }
  else if(bmi >= 25 && bmi <= 29.9){
    category = "Overweight ⚠️";
    color = "#ff9800"; // Orange
  }
  else{
    category = "Obese ❗";
    color = "#f44336"; // Red
  }
  
  resultDiv.style.display = "block";
  resultDiv.style.background = color;
  resultDiv.style.color = "#fff";
  resultDiv.innerHTML = `Your BMI: ${bmi} <br> Status: ${category}`;
}
</script>
</body>
    </html>
